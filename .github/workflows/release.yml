name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. 1.1.1)'
        required: true
      version:
        description: 'npm package version to publish (e.g. 1.4.0)'
        required: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

  docker:
    name: Push Docker Image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="v${{ inputs.tag }}"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/donations-api:${{ steps.version.outputs.version }}

  publish-npm-client:
    name: Publish npm Client
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:18.3-bookworm
        env:
          POSTGRES_DB: ${{ vars.CI_POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ vars.CI_POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Extract version
        id: version
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="v${{ inputs.version }}"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Generate OpenAPI spec
        run: ./gradlew generateOpenApiDocs

      - name: Set package version
        run: pnpm version ${{ steps.version.outputs.version }} --no-git-tag-version
        working-directory: packages/api-client

      - name: Install, generate and build
        working-directory: packages/api-client
        run: |
          pnpm install
          pnpm run generate
          pnpm run build

      - name: Publish to GitHub Packages
        working-directory: packages/api-client
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
