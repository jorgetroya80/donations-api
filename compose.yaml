services:
  postgres:
    image: postgres:18.3-bookworm
    environment:
      POSTGRES_DB: donations
      POSTGRES_USER: donations
      POSTGRES_PASSWORD: donations
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donations -d donations"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/donations
      SPRING_DATASOURCE_USERNAME: donations
      SPRING_DATASOURCE_PASSWORD: donations
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      postgres:
        condition: service_healthy
