plugins {
	id 'org.jetbrains.kotlin.jvm' version '2.4.20'
	id 'org.jetbrains.kotlin.plugin.spring' version '2.4.20'
	id 'org.jetbrains.kotlin.plugin.jpa' version '2.4.20'
	id 'org.springframework.boot' version '4.0.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '0.11.5'
	id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

// Spring Boot's BOM pins kotlin-stdlib, kotlin-reflect and kotlin-test to its own Kotlin
// version (2.2.21 in Boot 4.0.5), which io.spring.dependency-management then applies. Without
// this override the plugins above would run a 2.4.20 compiler against a 2.2.21 standard
// library, which only produces a warning.
ext['kotlin.version'] = '2.4.20'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(24)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.jetbrains.kotlin:kotlin-reflect'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
	implementation 'tools.jackson.module:jackson-module-kotlin'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
	compilerOptions {
		// The compiler moves to 2.4; the language level stays at 2.2 so the toolchain upgrade and
		// the language-level move are separate, revertable changes. Raising these two lines is the
		// whole of that later move — and it is what makes the annotation-default-target flag below
		// redundant, so drop the flag at the same time.
		languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
		apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_2_2
		freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

openApi {
	apiDocsUrl = 'http://localhost:8081/v3/api-docs.yaml'
	outputDir = file("${project.buildDir}/openapi")
	outputFileName = 'openapi.yaml'
}

tasks.named('forkedSpringBootRun') {
	dependsOn 'processAot', 'compileAotJava', 'compileAotKotlin', 'processAotResources'
}
