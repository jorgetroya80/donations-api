spring:
  application:
    name: donations
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/donations}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:donations}
    password: ${SPRING_DATASOURCE_PASSWORD:donations}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  devtools:
    add-properties: false
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:8081}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
app:
  cors:
    enabled: false
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}
management:
  endpoint:
    health:
      probes:
        enabled: true   # exposes /actuator/health/liveness (livenessState only, no DB)
logging:
  pattern:
    # Boot's readable pattern drops both MDC and key-values, which would leave dev
    # showing an event's name but not what it says. This slot is documented for the
    # correlation id; %kvp rides along so event fields are visible too. Prod ignores
    # the pattern entirely and emits JSON instead.
    correlation: "[%X{requestId:-}] %kvp "

---
spring:
  config:
    activate:
      on-profile: dev
app:
  cors:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  structured:
    format:
      console: ecs
