spring:
  application:
    name: donations
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/donations}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:donations}
    password: ${SPRING_DATASOURCE_PASSWORD:donations}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  devtools:
    add-properties: false
  jackson:
    default-property-inclusion: non_null
server:
  port: 8081
app:
  cors:
    enabled: false
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080}

---
spring:
  config:
    activate:
      on-profile: dev
app:
  cors:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
